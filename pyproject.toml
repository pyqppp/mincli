[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mincli"
version = "0.1.0"
description = "Mini CLI AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "tiktoken",
    "typer",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "trafilatura",
    "pdfminer.six",
    "python-docx",
    "mcp>=2.0.0",
    "textual>=4.0",
]

[project.scripts]
mincli = "mincli.cli:main"

[tool.setuptools.packages.find]
include = ["mincli*"]

[tool.setuptools.package-data]
mincli = ["*.md"]
# 子包的数据文件必须单独声明（键是包名，值相对该包目录）。
# 漏声明 mincli.tui 会让 chat.tcss 不进 wheel/sdist，
# 安装后 `mincli chat` 启动即 StylesheetError（回归测试见 tests/test_tui.py 的 test_packaging）。
"mincli.tui" = ["*.tcss"]
